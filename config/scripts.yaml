# ===== 招呼话术库 =====
# 用变量做个性化，避免"复制粘贴感"被平台判定为机器人群发。
# 可用变量：{name} 姓名 / {job} 岗位名 / {company} 公司名 / {reason} 模型生成的匹配理由 / {highlight} 候选人亮点
#
# 原则：
# 1. 三条以上轮换，避免同一句话高频重复；
# 2. 每条控制在 40 字以内，长了像广告；
# 3. 带一个具体提问，比"期待交流"回复率高得多。

scripts:
  sales_a: "{name}你好，看到你在{highlight}这块的经验，我们在招{job}，方便聊两句吗？"
  sales_b: "{name}你好，我们是做企业数字化服务的，在找有 B 端经验的{job}，你最近在看机会吗？"
  sales_c: "{name}你好，{reason}，我们{job}这个岗位挺匹配的，方便了解下你现在的状态吗？"

  patent_a: "{name}你好，看到你有专利撰写经验，我们在招执业{job}，电学和通信方向都有案子，方便聊聊吗？"
  patent_b: "{name}你好，我们是知识产权服务机构，在找能独立答复 OA 的{job}，你现在考虑换吗？"

  # 通用兜底
  generic_a: "{name}你好，看到你的背景和我们的{job}比较匹配，方便聊两句吗？"
